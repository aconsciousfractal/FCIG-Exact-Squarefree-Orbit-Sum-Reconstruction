name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -O -m unittest discover -s tests -v
      - run: python -B scripts/verify.py --profile core --git-state development
      - run: python -B -O scripts/verify.py --profile core --git-state development

  release-boundary:
    name: tagged release boundary / Python 3.12
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -O -m unittest discover -s tests -v
      - run: python -B scripts/verify.py --profile core --git-state release
      - run: python -B -O scripts/verify.py --profile core --git-state release
